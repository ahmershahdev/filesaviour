# One grouped PR per ecosystem per month, instead of one branch per package.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend/requirements
    schedule: { interval: monthly }
    groups:
      backend: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /engine
    schedule: { interval: monthly }
    groups:
      engine: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    groups:
      frontend: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /engine
    schedule: { interval: monthly }
